<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fatto · Linear-inspired workspace</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;font-synthesis:none;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0c0d0f}button,input{font:inherit}button{cursor:pointer}
[data-theme=dark]{--canvas:#0c0d0f;--sidebar:#111214;--panel:#151618;--panel-hover:#202124;--border:#292a2e;--border-soft:#222327;--text:#ededee;--secondary:#a0a0a7;--muted:#696a72;--accent:#8d8af5;--selected:#292a2f;--success:#49b87c;--warning:#e4bd52;--danger:#e26e77;--track:#303135;--pill:#25262a;--shadow:0 18px 75px rgba(0,0,0,.45)}
[data-theme=light]{color-scheme:light;--canvas:#f7f8fa;--sidebar:#f7f8fa;--panel:#fff;--panel-hover:#f0f1f4;--border:#e3e5ea;--border-soft:#eceef1;--text:#202127;--secondary:#646773;--muted:#9a9da6;--accent:#615bdb;--selected:#e9eaf0;--success:#15894c;--warning:#b7801a;--danger:#cc4f58;--track:#e7e8ec;--pill:#f0f1f4;--shadow:0 18px 75px rgba(24,27,38,.08)}
body{background:var(--canvas);color:var(--text);transition:background .18s,color .18s}
button{background:transparent;color:inherit;border:0}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{margin:26px auto;width:min(1450px,calc(100% - 52px));height:min(820px,calc(100vh - 52px));min-height:640px;display:grid;grid-template-columns:250px minmax(0,1fr);border:1px solid var(--border);border-radius:13px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.sidebar{background:var(--sidebar);padding:14px 11px;border-right:1px solid var(--border);overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:7px 10px 19px;font-size:14px;font-weight:650}.mark{width:18px;height:18px;border-radius:50%;background:repeating-linear-gradient(45deg,#ddd 0 2px,transparent 2px 4px);transform:rotate(-20deg)}.chev{color:var(--muted);font-size:11px}.spacer{flex:1}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;color:var(--secondary);height:33px}.nav:hover,.nav.active{background:var(--selected);color:var(--text)}
.ico{width:16px;flex:none;display:inline-flex;justify-content:center;font-size:15px;opacity:.85}.nav-title{font-size:12px;color:var(--muted);padding:24px 10px 8px}.favorite{display:flex;gap:11px;align-items:center;padding:8px 10px;color:var(--secondary)}.dot{width:9px;height:9px;border-radius:50%;background:var(--success)}.dot.purple{background:var(--accent)}.dot.orange{background:#e59a58}
.main{min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.top{height:55px;flex:none;display:flex;align-items:center;padding:0 23px;border-bottom:1px solid var(--border-soft);gap:14px}.crumb{font-size:13px;color:var(--text)}.right{margin-left:auto;display:flex;gap:9px;align-items:center}.icon-btn{height:28px;min-width:28px;border-radius:6px;color:var(--secondary)}.icon-btn:hover{background:var(--selected);color:var(--text)}.kbd{font-size:10px;border:1px solid var(--border);border-radius:4px;color:var(--muted);padding:2px 5px}
.tabs{display:flex;gap:5px;padding:13px 20px 11px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border-soft)}
.tab{background:var(--pill);border:1px solid transparent;color:var(--secondary);padding:6px 12px;border-radius:20px;white-space:nowrap}.tab.active{background:var(--selected);color:var(--text);font-weight:600}
.view{flex:1;min-height:0;overflow:auto}.heading{padding:24px 26px 17px;display:flex;align-items:center;justify-content:space-between}.heading h1{font-size:18px;letter-spacing:-.3px;font-weight:600;margin:0}.heading p{margin:6px 0 0;color:var(--muted);font-size:12px}
.columns{display:grid;grid-template-columns:minmax(240px,2.4fr) minmax(75px,.8fr) minmax(100px,1fr) minmax(95px,.8fr) minmax(110px,1fr);align-items:center;gap:12px;padding:0 26px}
.col-head{height:37px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border-soft)}
.row{min-height:62px;border-bottom:1px solid var(--border-soft);font-size:12px}.row:hover{background:var(--panel-hover)}
.name{display:flex;gap:11px;align-items:center;min-width:0}.glyph{display:grid;place-items:center;border-radius:7px;background:var(--pill);width:26px;height:26px;color:var(--accent);font-size:14px}.title{font-weight:550;font-size:13px}.subtitle{font-size:11px;color:var(--muted);margin-top:4px}.health{display:inline-flex;gap:7px;align-items:center}.health.good{color:var(--success)}.health.risk{color:var(--warning)}.health.bad{color:var(--danger)}.mini{font-size:10px;background:color-mix(in srgb,currentColor 14%,transparent);padding:3px 5px;border-radius:50%}.metric{color:var(--secondary)}.metric strong{font-weight:550;color:var(--text)}.pips{display:flex;gap:5px;align-items:center;color:var(--muted)}.pip{width:7px;height:7px;border-radius:50%;background:var(--success)}.pip.warn{background:var(--warning)}.pip.gray{background:var(--muted)}
.timeline{min-width:760px;position:relative;padding:0 25px 40px}.months{display:grid;grid-template-columns:repeat(6,1fr);color:var(--muted);font-size:11px;padding:22px 0 18px;border-bottom:1px solid var(--border-soft)}.gridlines{position:absolute;top:53px;bottom:0;left:25px;right:25px;display:grid;grid-template-columns:repeat(6,1fr);pointer-events:none}.gridlines span{border-left:1px dashed var(--border-soft)}.project{position:relative;margin:33px 0 45px}.project-title{display:flex;gap:8px;align-items:center;margin-bottom:11px;font-size:12px}.bar{height:27px;border:1px solid #45464a;border-radius:5px;background:linear-gradient(90deg,#292a2d,#35363a);position:relative;display:flex;align-items:center;justify-content:space-around;color:#8e8e96}.bar::after{content:"";position:absolute;inset:0 0 0 70%;background:linear-gradient(90deg,transparent,rgba(201,104,111,.17));border-right:1px dashed #b95c65}.bar.blue::after{background:linear-gradient(90deg,transparent,rgba(79,156,199,.18));border-color:#65a3c6}.milestone{position:relative;z-index:1}.milestone::after{content:"";position:absolute;top:25px;left:50%;height:11px;border-left:1px solid var(--muted)}.bar-note{font-size:10px;color:var(--muted);margin-top:17px;display:flex;justify-content:space-around}
.footer{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--muted)}
@media(max-width:850px){.shell{margin:0;width:100%;height:100vh;border-radius:0;grid-template-columns:195px minmax(0,1fr)}.columns{grid-template-columns:minmax(210px,2fr) 80px 105px 70px}.columns>*:last-child{display:none}}
@media(max-width:620px){.shell{display:block}.sidebar{display:none}.columns{min-width:660px}.view{overflow:auto}.top{padding:0 15px}.tabs{padding:10px}.heading{padding:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><div class="shell">
<aside class="sidebar">
<div class="brand"><span class="mark"></span> Fatto Workspace <span class="chev">⌄</span><span class="spacer"></span><span class="ico">⌕</span></div>
<button class="nav"><span class="ico">ϟ</span>动态</button><button class="nav"><span class="ico">▱</span>收件箱</button><button class="nav"><span class="ico">◌</span>我的任务</button><button class="nav"><span class="ico">⑂</span>代码评审</button>
<div class="nav-title">工作空间 ⌄</div>
<button class="nav active" data-view="list"><span class="ico">◇</span>研发计划</button><button class="nav" data-view="timeline"><span class="ico">⬡</span>项目时间线</button><button class="nav"><span class="ico">⋯</span>更多</button>
<div class="nav-title">收藏</div><div class="favorite"><span class="dot purple"></span>AI 研发平台</div><div class="favorite"><span class="dot orange"></span>前端工程化</div><div class="favorite"><span class="dot"></span>数字员工</div>
</aside>
<section class="main"><header class="top"><span class="crumb">工作空间&nbsp; / &nbsp;<b id="page-label">研发计划</b></span><div class="right"><span class="kbd">⌘ K</span><button class="icon-btn" id="theme" aria-label="切换主题" title="切换主题">☼</button><button class="icon-btn" title="视图设置">☷</button><button class="icon-btn" title="新增">＋</button></div></header>
<div class="tabs"><button class="tab active" data-view="list">全部计划</button><button class="tab" data-view="timeline">路线图</button><button class="tab">我的项目</button><button class="tab">进行中</button><span class="spacer"></span><button class="icon-btn" title="筛选">☰</button><button class="icon-btn" title="设置">☷</button></div>
<div class="view" id="list-view"><div class="heading"><div><h1>研发计划</h1><p>让项目进度、风险和交付状态一目了然。</p></div><button class="icon-btn" title="新增计划">＋</button></div>
<div class="columns col-head"><span>名称</span><span>目标</span><span>健康度</span><span>项目</span><span>活动</span></div><div id="list-rows"></div>
</div>
<div class="view" id="timeline-view" hidden><div class="heading"><div><h1>项目路线图</h1><p>跨项目时间线 · 里程碑 · 依赖关系</p></div><button class="icon-btn">☷</button></div><div class="timeline"><div class="months"><span>MAR</span><span>APR</span><span>MAY</span><span>JUN</span><span>JUL</span><span>AUG</span></div><div class="gridlines"><span></span><span></span><span></span><span></span><span></span><span></span></div><div id="timeline-rows"></div></div></div>
<div class="footer"><span>Fatto Design System · Linear-inspired exploration</span><span>Dark / Light · Keyboard accessible</span></div>
</section></div>
<script>
const initiatives=[
{icon:'✦',name:'AI 研发平台',sub:'统一研发工作台',target:'2026',health:'good',status:'正常',projects:'23 / 102',activity:[28,8,4]},
{icon:'▣',name:'前端工程化',sub:'脚手架 · 组件库 · 规范',target:'2026',health:'good',status:'正常',projects:'41 / 193',activity:[83,12,0]},
{icon:'✧',name:'研发数字员工',sub:'自主编排原子能力',target:'Q4 2026',health:'risk',status:'有风险',projects:'51 / 205',activity:[98,10,24]},
{icon:'♧',name:'知识库建设',sub:'团队知识与业务资产',target:'Q1 2027',health:'bad',status:'已延期',projects:'12 / 85',activity:[12,0,35]},
{icon:'⌘',name:'持续集成平台',sub:'交付流水线与质量门禁',target:'2027',health:'good',status:'正常',projects:'22 / 65',activity:[24,24,0]},
{icon:'◇',name:'移动端体验',sub:'跨端性能与体验优化',target:'Q2 2027',health:'good',status:'正常',projects:'8 / 127',activity:[79,0,0]}];
const rows=document.querySelector('#list-rows');
for(const item of initiatives){const el=document.createElement('div');el.className='columns row';const name=document.createElement('div');name.className='name';const glyph=document.createElement('span');glyph.className='glyph';glyph.textContent=item.icon;const wrap=document.createElement('div');const title=document.createElement('div');title.className='title';title.textContent=item.name;const sub=document.createElement('div');sub.className='subtitle';sub.textContent=item.sub;wrap.append(title,sub);name.append(glyph,wrap);const target=document.createElement('span');target.className='metric';target.textContent=item.target;const health=document.createElement('span');health.className='health '+item.health;health.textContent=(item.health==='good'?'●':item.health==='risk'?'◕':'◉')+' '+item.status;const project=document.createElement('span');project.className='metric';project.textContent='⬡ '+item.projects;const pips=document.createElement('div');pips.className='pips';for(let i=0;i<3;i++){if(!item.activity[i])continue;const dot=document.createElement('span');dot.className='pip '+(i===1?'warn':i===2?'gray':'');const count=document.createElement('span');count.textContent=item.activity[i];pips.append(dot,count)}el.append(name,target,health,project,pips);rows.append(el)}
const timelines=[['✦','AI 研发平台',14,49,'red'],['▣','前端工程化',2,90,'blue'],['✧','研发数字员工',32,65,'blue'],['♧','知识库建设',18,47,'red'],['◇','移动端体验',69,30,'blue']];
const timeline=document.querySelector('#timeline-rows');for(const [icon,name,left,width,color] of timelines){const section=document.createElement('div');section.className='project';const heading=document.createElement('div');heading.className='project-title';heading.textContent=icon+'  '+name;heading.style.marginLeft=left+'%';const bar=document.createElement('div');bar.className='bar '+color;bar.style.marginLeft=left+'%';bar.style.width=width+'%';for(const x of ['◇','◇','◇']){const m=document.createElement('span');m.className='milestone';m.textContent=x;bar.append(m)}const note=document.createElement('div');note.className='bar-note';note.style.marginLeft=left+'%';note.style.width=width+'%';for(const label of ['设计','开发','交付']){const s=document.createElement('span');s.textContent=label;note.append(s)}section.append(heading,bar,note);timeline.append(section)}
function show(view){document.querySelector('#list-view').hidden=view!=='list';document.querySelector('#timeline-view').hidden=view!=='timeline';document.querySelector('#page-label').textContent=view==='list'?'研发计划':'项目时间线';for(const el of document.querySelectorAll('[data-view]')){el.classList.toggle('active',el.dataset.view===view)}}
document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>show(el.dataset.view)));
document.querySelector('#theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'});
</script></body></html>
